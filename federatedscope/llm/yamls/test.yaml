use_gpu: True
expname_tag: "sparseA2"
device: 0
eval_device: 0
early_stop:
  patience: 0
federate:
  freeze_A: True
  mode: standalone
  client_num: 3
  total_round_num: 100
  save_to: "llama_gsm8k_3_FedDynMask_8b.ckpt"
  share_local_model: True
  online_aggr: False
personalization: 
  local_param: ['lora_B']
data:
  root: data/
  type: 'gsm8k@llm'
  splitter: 'iid'
llm:
  tok_len: 1000
  chat:
    max_len: 1000
  adapter:
    use: True
    args: [ { 'adapter_package': 'peft', 'adapter_method': 'lora', 'r': 32, 'lora_alpha': 64, 'lora_dropout': 0.05 } ]
dataloader:
  batch_size: 1
model:
  type: 'meta-llama/Meta-Llama-3-8B@huggingface_llm'
train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    lr: 0.0002
  is_enable_half: True
  sparse_B: True
  B_ratio: 0.1
criterion:
  type: CrossEntropyLoss
trainer:
  type: llmtrainer
eval:
  freq: 100
  metrics: ['loss']
  count_flops: False
